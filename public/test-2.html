<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>test-2 · tool sandbox</title>
  <style>
    :root {
      --bg-1: #F5F4ED;
      --bg-2: #FAF9F6;
      --bg-3: #EFEDE4;
      --bg-elev: #FFFFFF;
      --text: #2D2A26;
      --text-2: #6B6760;
      --text-3: #A09C92;
      --border: rgba(45, 42, 38, 0.10);
      --border-strong: rgba(45, 42, 38, 0.18);
      --accent: #E37553;
      --accent-soft: rgba(227, 117, 83, 0.10);
      --accent-hov: #C95E3C;
      --cyan: #6FA8B0;
      --cyan-soft: rgba(111, 168, 176, 0.12);
      --ok: #3E7B5A;
      --warn: #B45309;
      --danger: #B85040;
      --shadow-sm: 0 1px 0 rgba(45, 42, 38, 0.04);
      --shadow: 0 1px 2px rgba(45, 42, 38, 0.06);
      --shadow-lg: 0 8px 28px rgba(45, 42, 38, 0.12), 0 2px 4px rgba(45, 42, 38, 0.06);
      --radius-sm: 8px;
      --radius: 12px;
      --sans: "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      --mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg-1); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    body { display: flex; flex-direction: column; min-height: 100vh; }

    header {
      display: flex; align-items: center; gap: 16px;
      padding: 12px 20px;
      background: var(--bg-2);
      border-bottom: 1px solid var(--border);
    }
    header .title { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
    header .title .badge {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 8px;
      font-size: 11px; font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      border-radius: 999px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    header .sub { color: var(--text-2); font-size: 13px; }
    header .spacer { flex: 1; }
    header .stat {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-2);
    }
    header .stat b { color: var(--text); font-weight: 600; }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 0;
      min-height: 0;
    }

    /* ── Left: tool list ─────────────────────────────────────────── */
    aside.tools {
      background: var(--bg-2);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      min-height: 0;
    }
    .filter {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }
    .filter input {
      width: 100%;
      padding: 8px 10px;
      font-family: var(--sans);
      font-size: 13px;
      color: var(--text);
      background: var(--bg-elev);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      outline: none;
      transition: border-color 0.12s, box-shadow 0.12s;
    }
    .filter input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .tool-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 0;
    }
    .tool-row {
      display: block;
      padding: 7px 14px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text);
      cursor: pointer;
      border-left: 2px solid transparent;
      transition: background 0.08s, border-color 0.08s;
    }
    .tool-row:hover { background: var(--bg-3); }
    .tool-row.active {
      background: var(--accent-soft);
      border-left-color: var(--accent);
      color: var(--accent-hov);
      font-weight: 600;
    }
    .tool-row .desc {
      display: block;
      font-family: var(--sans);
      font-size: 11px;
      color: var(--text-2);
      font-weight: 400;
      margin-top: 1px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tool-row.active .desc { color: var(--text); }

    /* ── Right: detail + run ─────────────────────────────────────── */
    section.detail {
      display: flex; flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    .detail-empty {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-3);
      font-size: 14px;
    }
    .detail-head {
      padding: 18px 24px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-2);
    }
    .detail-head h2 {
      font-family: var(--mono);
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
    }
    .detail-head p {
      margin-top: 6px;
      color: var(--text-2);
      font-size: 13px;
      max-width: 720px;
    }

    .detail-body {
      flex: 1;
      overflow-y: auto;
      padding: 18px 24px 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      align-content: start;
    }
    .panel {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      display: flex; flex-direction: column;
      min-height: 0;
    }
    .panel-head {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
    }
    .panel-head .label {
      font-size: 11px; font-weight: 600;
      color: var(--text-2);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .panel-head .spacer { flex: 1; }

    .schema-body, .args-body, .response-body {
      padding: 12px 14px;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.55;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 420px;
      overflow: auto;
    }
    .schema-body { color: var(--text-2); }

    textarea.args-input {
      width: 100%;
      min-height: 220px;
      max-height: 420px;
      padding: 12px 14px;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.55;
      color: var(--text);
      background: transparent;
      border: 0;
      outline: none;
      resize: vertical;
    }

    .actions {
      grid-column: 1 / -1;
      display: flex; align-items: center; gap: 10px;
      padding-top: 4px;
    }
    button {
      font-family: var(--sans);
      font-size: 13px; font-weight: 600;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
      border: 1px solid var(--border-strong);
      background: var(--bg-elev);
      color: var(--text);
    }
    button:hover { background: var(--bg-3); }
    button.primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    button.primary:hover { background: var(--accent-hov); border-color: var(--accent-hov); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .status {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-2);
    }
    .status .ok    { color: var(--ok); font-weight: 600; }
    .status .err   { color: var(--danger); font-weight: 600; }
    .status .warn  { color: var(--warn); font-weight: 600; }
    .status .ms    { color: var(--text-3); }

    .response-body.empty { color: var(--text-3); font-style: italic; }

    .pill {
      display: inline-block;
      padding: 1px 7px;
      font-family: var(--mono);
      font-size: 11px;
      border-radius: 999px;
      background: var(--bg-3);
      color: var(--text-2);
      border: 1px solid var(--border);
    }

    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
      aside.tools { max-height: 240px; border-right: 0; border-bottom: 1px solid var(--border); }
      .detail-body { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="title">test-2 <span class="badge">tool sandbox</span></div>
    <div class="sub" id="hint">pick a tool · edit args · hit run</div>
    <div class="spacer"></div>
    <div class="stat"><b id="tool-count">0</b> tools registered</div>
  </header>

  <main>
    <aside class="tools">
      <div class="filter">
        <input id="filter" type="search" placeholder="filter by name or description…" autocomplete="off" spellcheck="false" />
      </div>
      <div class="tool-list" id="tool-list"></div>
    </aside>

    <section class="detail" id="detail">
      <div class="detail-empty" id="empty">← select a tool to begin</div>
    </section>
  </main>

  <template id="detail-template">
    <div class="detail-head">
      <h2 id="d-name"></h2>
      <p id="d-desc"></p>
    </div>
    <div class="detail-body">
      <div class="panel">
        <div class="panel-head">
          <span class="label">Schema</span>
          <span class="spacer"></span>
          <span class="pill" id="d-required-count"></span>
        </div>
        <div class="schema-body" id="d-schema"></div>
      </div>
      <div class="panel">
        <div class="panel-head">
          <span class="label">Arguments (JSON)</span>
          <span class="spacer"></span>
          <button id="d-prefill" type="button" title="rebuild example body from the schema">prefill</button>
        </div>
        <textarea class="args-input" id="d-args" spellcheck="false" autocomplete="off"></textarea>
      </div>
      <div class="actions">
        <button class="primary" id="d-run" type="button">Run</button>
        <button id="d-clear" type="button">Clear response</button>
        <span class="status" id="d-status">idle</span>
      </div>
      <div class="panel" style="grid-column: 1 / -1;">
        <div class="panel-head">
          <span class="label">Response</span>
          <span class="spacer"></span>
          <button id="d-copy" type="button">Copy</button>
        </div>
        <div class="response-body empty" id="d-response">— no response yet —</div>
      </div>
    </div>
  </template>

  <script>
    const $ = (sel, root = document) => root.querySelector(sel);
    const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

    let TOOLS = [];
    let selected = null;

    // ── Boot ──────────────────────────────────────────────────────────
    async function loadTools() {
      try {
        const res = await fetch('/omo/api/tools', { cache: 'no-store' });
        const json = await res.json();
        if (!json.ok || !Array.isArray(json.tools)) throw new Error('bad shape');
        TOOLS = json.tools.sort((a, b) => a.name.localeCompare(b.name));
        $('#tool-count').textContent = String(TOOLS.length);
        renderList('');
      } catch (err) {
        $('#tool-count').textContent = '!';
        $('#hint').innerHTML = '<span style="color: var(--danger)">failed to load /omo/api/tools — is the server up?</span>';
      }
    }

    function renderList(filter) {
      const list = $('#tool-list');
      const q = filter.trim().toLowerCase();
      list.innerHTML = '';
      const matched = TOOLS.filter(t => {
        if (!q) return true;
        return t.name.toLowerCase().includes(q) || (t.description || '').toLowerCase().includes(q);
      });
      if (matched.length === 0) {
        list.innerHTML = '<div style="padding: 18px 14px; color: var(--text-3); font-size: 12px;">no tools match</div>';
        return;
      }
      for (const t of matched) {
        const row = document.createElement('div');
        row.className = 'tool-row' + (selected?.name === t.name ? ' active' : '');
        row.dataset.name = t.name;
        row.innerHTML = `${t.name}<span class="desc">${escapeHtml(shortDesc(t.description))}</span>`;
        row.addEventListener('click', () => selectTool(t.name));
        list.appendChild(row);
      }
    }

    function shortDesc(s) {
      if (!s) return '—';
      const first = String(s).split('\n')[0].trim();
      return first.length > 90 ? first.slice(0, 87) + '…' : first;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    // ── Selection / detail render ─────────────────────────────────────
    function selectTool(name) {
      const tool = TOOLS.find(t => t.name === name);
      if (!tool) return;
      selected = tool;
      $$('.tool-row').forEach(r => r.classList.toggle('active', r.dataset.name === name));

      const detail = $('#detail');
      detail.innerHTML = '';
      const tpl = $('#detail-template').content.cloneNode(true);
      detail.appendChild(tpl);

      $('#d-name').textContent = tool.name;
      $('#d-desc').textContent = tool.description || '(no description)';

      const required = Array.isArray(tool.parameters?.required) ? tool.parameters.required : [];
      $('#d-required-count').textContent = required.length
        ? `${required.length} required`
        : 'no required args';

      $('#d-schema').textContent = tool.parameters
        ? JSON.stringify(tool.parameters, null, 2)
        : '(no parameter schema)';

      $('#d-args').value = examplePayload(tool);

      $('#d-prefill').addEventListener('click', () => {
        $('#d-args').value = examplePayload(tool);
        flashStatus('prefilled', 'warn');
      });
      $('#d-clear').addEventListener('click', () => {
        const r = $('#d-response');
        r.textContent = '— no response yet —';
        r.classList.add('empty');
        flashStatus('cleared', 'warn');
      });
      $('#d-copy').addEventListener('click', () => {
        const txt = $('#d-response').textContent;
        navigator.clipboard?.writeText(txt).then(
          () => flashStatus('copied', 'ok'),
          () => flashStatus('copy failed', 'err'),
        );
      });
      $('#d-run').addEventListener('click', runTool);
      $('#d-args').addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); runTool(); }
      });
    }

    function examplePayload(tool) {
      const props = tool.parameters?.properties || {};
      const required = new Set(tool.parameters?.required || []);
      const body = {};
      for (const [k, schema] of Object.entries(props)) {
        if (!required.has(k)) continue;
        body[k] = sampleFor(schema);
      }
      if (Object.keys(body).length === 0) {
        // include the first non-required field as a hint
        const first = Object.entries(props)[0];
        if (first) body[first[0]] = sampleFor(first[1]);
      }
      return JSON.stringify(body, null, 2);
    }

    function sampleFor(schema) {
      if (!schema || typeof schema !== 'object') return null;
      if (schema.enum && schema.enum.length) return schema.enum[0];
      switch (schema.type) {
        case 'string':  return schema.example ?? schema.default ?? '';
        case 'number':
        case 'integer': return schema.example ?? schema.default ?? 0;
        case 'boolean': return schema.example ?? schema.default ?? false;
        case 'array':   return [];
        case 'object': {
          const out = {};
          for (const [k, s] of Object.entries(schema.properties || {})) {
            if ((schema.required || []).includes(k)) out[k] = sampleFor(s);
          }
          return out;
        }
        default: return null;
      }
    }

    // ── Run ───────────────────────────────────────────────────────────
    async function runTool() {
      if (!selected) return;
      const runBtn = $('#d-run');
      const respEl = $('#d-response');
      let args;
      try {
        const raw = $('#d-args').value.trim();
        args = raw ? JSON.parse(raw) : {};
      } catch (e) {
        setStatus(`json parse error: ${e.message}`, 'err');
        return;
      }
      runBtn.disabled = true;
      setStatus('running…');
      respEl.classList.remove('empty');
      respEl.textContent = '… awaiting /tool …';

      const t0 = performance.now();
      try {
        const res = await fetch('/tool', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: selected.name, arguments: args }),
        });
        const ms = Math.round(performance.now() - t0);
        const text = await res.text();
        let pretty = text;
        try { pretty = JSON.stringify(JSON.parse(text), null, 2); } catch (_) {}
        respEl.textContent = pretty;
        if (res.ok) setStatus(`200 OK · ${ms} ms`, 'ok');
        else        setStatus(`${res.status} ${res.statusText} · ${ms} ms`, 'err');
      } catch (err) {
        respEl.textContent = String(err?.stack || err);
        setStatus(`network error · ${err?.message || err}`, 'err');
      } finally {
        runBtn.disabled = false;
      }
    }

    function setStatus(text, kind) {
      const el = $('#d-status');
      if (!el) return;
      if (kind) el.innerHTML = `<span class="${kind}">${escapeHtml(text)}</span>`;
      else      el.textContent = text;
    }
    let flashTimer = null;
    function flashStatus(text, kind) {
      setStatus(text, kind);
      clearTimeout(flashTimer);
      flashTimer = setTimeout(() => setStatus('idle'), 1500);
    }

    // ── Wire ──────────────────────────────────────────────────────────
    $('#filter').addEventListener('input', (e) => renderList(e.target.value));
    loadTools();
  </script>
</body>
</html>
